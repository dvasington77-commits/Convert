name: Build & Release

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build EXE
        run: |
          if (Test-Path icon.ico) {
            pyinstaller --onefile --noconsole --name cd_envelope --icon=icon.ico cd_envelope.py
          } else {
            pyinstaller --onefile --noconsole --name cd_envelope cd_envelope.py
          }
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cd_envelope-windows
          path: dist/cd_envelope.exe

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/cd_envelope.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build binary
        run: pyinstaller --onefile --name cd_envelope cd_envelope.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cd_envelope-linux
          path: dist/cd_envelope

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/cd_envelope
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build binary
        run: pyinstaller --onefile --name cd_envelope cd_envelope.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cd_envelope-macos
          path: dist/cd_envelope

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/cd_envelope
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
